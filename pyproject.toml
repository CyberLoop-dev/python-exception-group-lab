[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-exception-group-lab"
version = "1.0.0"
description = "A CLI demonstration of ExceptionGroup and except*."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
exception-group-lab = "exception_group_lab:main"

[tool.setuptools]
py-modules = ["exception_group_lab"]
